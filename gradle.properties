# ==============================================================================
# Project-wide Gradle & Android Build Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. JVM & Memory Settings
# ------------------------------------------------------------------------------
# Allocates memory and JVM tuning options for the Gradle daemon:
#   -Xmx4g: Sets maximum heap size to 4 GB for handling multi-module builds & KSP/Kover tasks.
#   -XX:MetaspaceSize=512m: Initial memory for class metadata, preventing early GC cycles.
#   -XX:+HeapDumpOnOutOfMemoryError: Writes a heap dump file if the daemon runs out of memory.
#   -Dfile.encoding=UTF-8: Guarantees consistent UTF-8 file encoding across OS platforms (macOS/Linux/CI).
org.gradle.jvmargs=-Xmx4g -XX:MetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ------------------------------------------------------------------------------
# 2. Gradle Performance & Build Cache
# ------------------------------------------------------------------------------
# Keeps the Gradle daemon alive in the background between builds to avoid JVM startup cost.
org.gradle.daemon=true

# Compiles and executes independent subprojects/modules in parallel across available CPU cores.
org.gradle.parallel=true

# Configures only projects needed by the requested tasks rather than evaluating all submodules.
# WARNING / INCUBATING: 'configureondemand' has known issues with complex multi-module task graphs
# and is superseded by Configuration Cache and Isolated Projects in Gradle 9+.
org.gradle.configureondemand=true

# Caches the task graph / configuration phase across builds.
# Bypasses build script re-evaluation when build inputs (build.gradle, properties) haven't changed.
org.gradle.configuration-cache=true

# Enables local and remote build caching of task outputs (e.g. Kotlin compilation, tests).
org.gradle.caching=true

# Enables parallel Gradle sync in IDEs (Android Studio / IntelliJ) via the Tooling API (Gradle 9.4+).
org.gradle.tooling.parallel=true

# ------------------------------------------------------------------------------
# 3. Android Gradle Plugin (AGP) Settings
# ------------------------------------------------------------------------------
# Automatically downloads missing Android SDK platforms and build tools if licenses are accepted.
android.builder.sdkDownload=true

# Enables AndroidX dependencies instead of the legacy Android Support Library.
# WARNING / REDUNDANT: Defaulted to 'true' since AGP 9.0+. The legacy Support Library is deprecated
# and removed. This flag can be safely omitted in future AGP cleanups.
android.useAndroidX=true

# Determines if R classes contain transitive resource references from dependencies.
#   false = Each module's R class includes resources from all dependent modules (legacy behavior).
#   true  = Each module only exposes its own resources in its R class (faster builds, smaller bytecode).
# WARNING / DEPRECATION: 'false' is legacy behavior. AGP has deprecated transitive R classes and
# will eventually remove support for 'false'. Migrate to 'true' and import resources explicitly.
android.nonTransitiveRClass=false

# Generates resource IDs as non-final fields ('var') in library and app modules to speed up compilation.
# WARNING / REDUNDANT: In AGP 9.0+, non-final resource IDs are enabled by default everywhere.
android.nonFinalResIds=true

# ------------------------------------------------------------------------------
# 4. Kotlin Compiler Configuration
# ------------------------------------------------------------------------------
# Enforces the official Kotlin code style guidelines (formatting, indentation, naming).
kotlin.code.style=official

# ------------------------------------------------------------------------------
# 5. JUnit 4 (Vintage Engine) Parallel Test Execution
# ------------------------------------------------------------------------------
# Enables concurrent test execution for legacy JUnit 4 tests running under the Vintage engine.
junit.vintage.execution.parallel.enabled=true

# Allows different test classes to be executed in parallel.
junit.vintage.execution.parallel.classes=true

# Allows different test methods inside the same class to be executed concurrently.
junit.vintage.execution.parallel.methods=true

# Restricts the Vintage concurrency worker pool to 4 threads to prevent CPU/memory starvation.
junit.vintage.execution.parallel.pool-size=4

# ------------------------------------------------------------------------------
# 6. JUnit 5 (Jupiter Engine) Parallel Test Execution
# ------------------------------------------------------------------------------
# Reference: https://junit.org/junit5/docs/current/user-guide/#writing-tests-parallel-execution
# Enables concurrent test execution for JUnit Jupiter (JUnit 5) unit tests.
junit.jupiter.execution.parallel.enabled=true

# Sets the default execution mode for individual test methods to run concurrently.
junit.jupiter.execution.parallel.mode.default=concurrent

# Keeps test classes running in isolation on the same thread to avoid shared-state test pollution.
junit.jupiter.execution.parallel.mode.classes.default=same_thread
